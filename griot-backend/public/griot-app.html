<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GRIOT — Plateforme de Mémoire Familiale</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" />
  <style>
    :root {
      --cream: #f6efe1;
      --paper: #fffbf3;
      --surface: #fffdfa;
      --ink: #2b1b12;
      --ink-soft: #5b4636;
      --gold: #c9932e;
      --gold-deep: #a9782a;
      --terracotta: #b5502a;
      --terracotta-deep: #8f3e20;
      --olive: #4b5d3b;
      --line: #e3d5b8;
      --error: #c84432;
      --success: #4b5d3b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: 'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--cream);
      color: var(--ink);
    }

    #root {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ANIMATIONS */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes slideInFromLeft { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes slideInFromRight { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: translateX(0); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }

    /* MODAL OVERLAY */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(43, 27, 18, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      animation: fadeIn 0.3s ease;
    }

    .modal-content {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 28px;
      max-width: 500px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      animation: slideInFromRight 0.3s ease;
    }

    .modal-header {
      font-family: 'Fraunces', serif;
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: var(--ink-soft);
      padding: 0;
    }

    /* HEADER */
    .header {
      background: var(--paper);
      border-bottom: 1px solid var(--line);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-logo {
      font-family: 'Fraunces', serif;
      font-size: 22px;
      font-weight: 700;
      color: var(--ink);
      text-decoration: none;
      cursor: pointer;
    }

    .header-right {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--cream);
      color: var(--ink-soft);
    }

    .status-badge.online {
      background: rgba(75, 93, 59, 0.15);
      color: var(--olive);
    }

    .status-badge.offline {
      background: rgba(200, 68, 50, 0.15);
      color: var(--error);
    }

    /* MAIN CONTAINER */
    .main-container {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    .nav-rail {
      background: var(--paper);
      border-right: 1px solid var(--line);
      padding: 12px 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-width: 80px;
      height: calc(100vh - 60px);
      overflow-y: auto;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 12px 8px;
      border: 1px solid transparent;
      border-radius: 10px;
      background: transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--ink-soft);
      font-size: 10px;
      font-weight: 600;
      text-align: center;
      width: 64px;
      min-height: 64px;
    }

    .nav-item:hover {
      background: var(--cream);
      color: var(--ink);
    }

    .nav-item.active {
      background: linear-gradient(135deg, rgba(201, 147, 46, 0.15), rgba(181, 80, 42, 0.1));
      border: 1px solid var(--gold);
      color: var(--gold-deep);
    }

    .nav-icon {
      width: 20px;
      height: 20px;
    }

    /* CONTENT */
    .content {
      flex: 1;
      overflow-y: auto;
      background: var(--cream);
    }

    .content-inner {
      padding: 24px;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      animation: fadeInUp 0.4s ease;
    }

    /* CARDS */
    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(43, 27, 18, 0.04);
      transition: all 0.2s ease;
    }

    .card:hover {
      box-shadow: 0 8px 20px rgba(43, 27, 18, 0.08);
      transform: translateY(-2px);
    }

    .card-header {
      font-family: 'Fraunces', serif;
      font-size: 18px;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: 16px;
    }

    /* GRIDS */
    .grid-1 { display: grid; grid-template-columns: 1fr; gap: 16px; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }

    @media (max-width: 768px) {
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
    }

    /* BUTTONS */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-family: 'Work Sans', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--gold), var(--terracotta));
      color: white;
      box-shadow: 0 4px 12px rgba(201, 147, 46, 0.2);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(201, 147, 46, 0.35);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-secondary {
      background: var(--cream);
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .btn-secondary:hover {
      background: var(--paper);
    }

    .btn-sm {
      padding: 8px 12px;
      font-size: 12px;
    }

    .btn-block {
      width: 100%;
      justify-content: center;
    }

    /* INPUTS */
    .input-group {
      margin-bottom: 16px;
    }

    .input-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: var(--ink-soft);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-field {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-family: 'Work Sans', sans-serif;
      font-size: 14px;
      color: var(--ink);
      background: var(--paper);
      transition: all 0.2s ease;
    }

    .input-field:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(201, 147, 46, 0.1);
    }

    .input-field::placeholder {
      color: var(--ink-soft);
    }

    .textarea {
      resize: vertical;
      min-height: 100px;
      font-family: 'Work Sans', sans-serif;
    }

    /* LISTS */
    .list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid var(--line);
    }

    .list-item:last-child {
      border-bottom: none;
    }

    .list-item-content {
      flex: 1;
    }

    .list-item-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
    }

    .list-item-subtitle {
      font-size: 12px;
      color: var(--ink-soft);
      margin-top: 2px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--cream);
      color: var(--ink-soft);
    }

    .badge.active {
      background: rgba(75, 93, 59, 0.15);
      color: var(--olive);
    }

    /* RESPONSIVE */
    @media (max-width: 1024px) {
      .nav-rail { min-width: 70px; }
      .nav-item { min-width: 58px; }
      .content-inner { padding: 20px; }
    }

    @media (max-width: 768px) {
      .header { padding: 12px 16px; }
      .header-logo { font-size: 18px; }
      .nav-rail { min-width: 64px; padding: 8px 4px; }
      .nav-item { padding: 10px 6px; min-width: 56px; font-size: 9px; width: 52px; min-height: 52px; }
      .content-inner { padding: 16px; }
      .card { padding: 16px; }
      .card-header { font-size: 16px; }
    }

    @media (max-width: 640px) {
      .main-container { flex-direction: column; }
      .nav-rail { flex-direction: row; height: auto; border-right: none; border-bottom: 1px solid var(--line); overflow-x: auto; padding: 8px; }
      .nav-item { flex-shrink: 0; }
      .content-inner { padding: 14px; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <script type="module">
    const { useState, useEffect, useCallback, useRef } = React;
    const e = React.createElement;

    // ========================= ICONS =========================
    const Icon = {
      Home: () => e('svg', { width: 20, height: 20, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2 }, 
        e('path', { d: 'M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z' }),
        e('polyline', { points: '9 22 9 12 15 12 15 22' })),
      
      GitBranch: () => e('svg', { width: 20, height: 20, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2 }, 
        e('line', { x1: '6', y1: '3', x2: '6', y2: '15' }),
        e('circle', { cx: '18', cy: '6', r: '3' }),
        e('circle', { cx: '6', cy: '18', r: '3' }),
        e('path', { d: 'M18 9a9 9 0 0 1-9 9' })),
      
      MapPin: () => e('svg', { width: 20, height: 20, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2 }, 
        e('path', { d: 'M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z' }),
        e('circle', { cx: '12', cy: '10', r: '3' })),
      
      BookOpen: () => e('svg', { width: 20, height: 20, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2 }, 
        e('path', { d: 'M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z' }),
        e('path', { d: 'M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z' })),
      
      Users: () => e('svg', { width: 20, height: 20, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2 }, 
        e('path', { d: 'M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2' }),
        e('circle', { cx: '9', cy: '7', r: '4' }),
        e('path', { d: 'M23 21v-2a4 4 0 0 0-3-3.87' }),
        e('path', { d: 'M16 3.13a4 4 0 0 1 0 7.75' })),
      
      Settings: () => e('svg', { width: 20, height: 20, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2 }, 
        e('circle', { cx: '12', cy: '12', r: '3' }),
        e('path', { d: 'M12 1v6m0 6v6M4.22 4.22l4.24 4.24m2.12 2.12l4.24 4.24M1 12h6m6 0h6M4.22 19.78l4.24-4.24m2.12-2.12l4.24-4.24' })),
      
      LogOut: () => e('svg', { width: 20, height: 20, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2 }, 
        e('path', { d: 'M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4' }),
        e('polyline', { points: '16 17 21 12 16 7' }),
        e('line', { x1: '21', y1: '12', x2: '9', y2: '12' })),
      
      Plus: () => e('svg', { width: 20, height: 20, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2 }, 
        e('line', { x1: '12', y1: '5', x2: '12', y2: '19' }),
        e('line', { x1: '5', y1: '12', x2: '19', y2: '12' })),
      
      X: () => e('svg', { width: 20, height: 20, viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2 }, 
        e('line', { x1: '18', y1: '6', x2: '6', y2: '18' }),
        e('line', { x1: '6', y1: '6', x2: '18', y2: '18' })),
    };

    // ========================= SCREENS =========================
    function HomeScreen() {
      const [showLoginModal, setShowLoginModal] = useState(false);

      return e('div', { className: 'content-inner' },
        e('div', { style: { textAlign: 'center', marginBottom: 40 } },
          e('h1', { style: { fontFamily: "'Fraunces', serif", fontSize: 42, fontWeight: 700, marginBottom: 16 } },
            'Retrouvez vos ancêtres'
          ),
          e('p', { style: { fontSize: 18, color: 'var(--ink-soft)', marginBottom: 32, lineHeight: 1.6 } },
            'Préservez la mémoire de votre famille et transmettez son histoire aux générations futures'
          ),
          e('div', { style: { display: 'flex', gap: 12, justifyContent: 'center', flexWrap: 'wrap' } },
            e('button', { className: 'btn btn-primary', style: { padding: '14px 28px', fontSize: 16 }, onClick: () => setShowLoginModal(true) },
              Icon.Plus(), ' Créer mon arbre'
            ),
            e('button', { className: 'btn btn-secondary', style: { padding: '14px 28px', fontSize: 16 } },
              'Découvrir la plateforme'
            )
          )
        ),
        e('div', { className: 'grid-2', style: { marginTop: 40 } },
          e('div', { className: 'card', style: { animation: 'fadeInUp 0.4s ease 0.1s both' } },
            e('h3', { className: 'card-header' }, '🌳 Votre arbre généalogique'),
            e('p', { style: { color: 'var(--ink-soft)', lineHeight: 1.6 } },
              'Organisez vos ancêtres et descendants sur plusieurs générations. Visualisez toute votre histoire familiale en un coup d\'œil.'
            )
          ),
          e('div', { className: 'card', style: { animation: 'fadeInUp 0.4s ease 0.2s both' } },
            e('h3', { className: 'card-header' }, '🎙️ Mémoire familiale'),
            e('p', { style: { color: 'var(--ink-soft)', lineHeight: 1.6 } },
              'Enregistrez histoires orales, traditions culinaires, danses et héritages culturels. Préservez les voix de vos aînés.'
            )
          ),
          e('div', { className: 'card', style: { animation: 'fadeInUp 0.4s ease 0.3s both' } },
            e('h3', { className: 'card-header' }, '🌍 Origines et migrations'),
            e('p', { style: { color: 'var(--ink-soft)', lineHeight: 1.6 } },
              'Tracez les routes de votre famille à travers l\'Afrique. Documentez villes, dates et circonstances des migrations.'
            )
          ),
          e('div', { className: 'card', style: { animation: 'fadeInUp 0.4s ease 0.4s both' } },
            e('h3', { className: 'card-header' }, '👥 Collaboration sécurisée'),
            e('p', { style: { color: 'var(--ink-soft)', lineHeight: 1.6 } },
              'Invitez famille, historiens et chefferies pour enrichir vos données. Contrôlez qui peut voir et modifier.'
            )
          )
        ),
        showLoginModal && e(LoginModal, { onClose: () => setShowLoginModal(false) })
      );
    }

    function LoginModal({ onClose }) {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');

      return e('div', { className: 'modal-overlay', onClick: onClose },
        e('div', { className: 'modal-content', onClick: (e) => e.stopPropagation() },
          e('div', { className: 'modal-header' },
            e('span', null, 'Se connecter'),
            e('button', { className: 'close-btn', onClick: onClose }, '×')
          ),
          e('div', { className: 'input-group' },
            e('label', { className: 'input-label' }, 'Email'),
            e('input', { className: 'input-field', type: 'email', placeholder: 'vous@exemple.com', value: email, onChange: (e) => setEmail(e.target.value) })
          ),
          e('div', { className: 'input-group' },
            e('label', { className: 'input-label' }, 'Mot de passe'),
            e('input', { className: 'input-field', type: 'password', placeholder: '••••••••', value: password, onChange: (e) => setPassword(e.target.value) })
          ),
          e('button', { className: 'btn btn-primary btn-block', style: { marginBottom: 12 } }, 'Connexion'),
          e('p', { style: { textAlign: 'center', fontSize: 13, color: 'var(--ink-soft)' } },
            'Pas encore de compte? ', e('a', { href: '#', style: { color: 'var(--gold)', textDecoration: 'none', fontWeight: 600 } }, 'S\'inscrire')
          )
        )
      );
    }

    function DashboardScreen() {
      const [showAddPerson, setShowAddPerson] = useState(false);

      return e('div', { className: 'content-inner' },
        e('div', { style: { marginBottom: 32 } },
          e('h1', { style: { fontFamily: "'Fraunces', serif", fontSize: 28, fontWeight: 600, marginBottom: 8 } },
            'Tableau de bord'
          ),
          e('p', { style: { color: 'var(--ink-soft)' } },
            'Gérez votre arbre généalogique et sa mémoire familiale'
          )
        ),
        e('div', { className: 'grid-2', style: { marginBottom: 24 } },
          e('div', { className: 'card', style: { animation: 'fadeInUp 0.4s ease' } },
            e('h3', { className: 'card-header' }, '🌳 Mon arbre'),
            e('p', { style: { color: 'var(--ink-soft)', marginBottom: 16 } }, '47 personnes documentées'),
            e('div', { style: { marginBottom: 12 } },
              e('span', { style: { fontSize: 12, fontWeight: 600, color: 'var(--ink-soft)' } }, 'Complétude: '),
              e('div', { style: { width: '100%', height: 6, background: 'var(--cream)', borderRadius: 3, overflow: 'hidden', marginTop: 6 } },
                e('div', { style: { width: '65%', height: '100%', background: 'linear-gradient(90deg, var(--gold), var(--terracotta))' } })
              )
            ),
            e('button', { className: 'btn btn-primary btn-sm' },
              Icon.GitBranch(), 'Voir l\'arbre'
            )
          ),
          e('div', { className: 'card', style: { animation: 'fadeInUp 0.4s ease 0.1s both' } },
            e('h3', { className: 'card-header' }, '📋 Missions'),
            e('p', { style: { color: 'var(--ink-soft)', marginBottom: 16 } }, '3 tâches cette semaine'),
            e('ul', { style: { fontSize: 13, color: 'var(--ink-soft)', lineHeight: 1.8 } },
              e('li', null, '✓ Ajouter Amos Mvondo'),
              e('li', null, '◯ Documenter traditions'),
              e('li', null, '◯ Inviter collaborateurs')
            )
          ),
          e('div', { className: 'card', style: { animation: 'fadeInUp 0.4s ease 0.2s both' } },
            e('h3', { className: 'card-header' }, '👥 Équipe'),
            e('p', { style: { color: 'var(--ink-soft)', marginBottom: 16 } }, '3 collaborateurs actifs'),
            e('button', { className: 'btn btn-primary btn-sm' },
              Icon.Users(), 'Gérer l\'équipe'
            )
          ),
          e('div', { className: 'card', style: { animation: 'fadeInUp 0.4s ease 0.3s both' } },
            e('h3', { className: 'card-header' }, '⚡ Actions rapides'),
            e('div', { style: { display: 'flex', flexDirection: 'column', gap: 8 } },
              e('button', { className: 'btn btn-secondary btn-sm btn-block', onClick: () => setShowAddPerson(true) },
                Icon.Plus(), 'Ajouter une personne'
              ),
              e('button', { className: 'btn btn-secondary btn-sm btn-block' },
                'Ajouter un souvenir'
              )
            )
          )
        ),
        showAddPerson && e(AddPersonModal, { onClose: () => setShowAddPerson(false) })
      );
    }

    function AddPersonModal({ onClose }) {
      const [formData, setFormData] = useState({ nom: '', prenom: '', anneeNaissance: '', anneeDecès: '', lieu: '' });

      const handleChange = (field, value) => {
        setFormData({ ...formData, [field]: value });
      };

      const handleSubmit = () => {
        if (formData.nom && formData.prenom) {
          console.log('Ajouter personne:', formData);
          onClose();
        }
      };

      return e('div', { className: 'modal-overlay', onClick: onClose },
        e('div', { className: 'modal-content', onClick: (e) => e.stopPropagation() },
          e('div', { className: 'modal-header' },
            e('span', null, '➕ Ajouter une personne'),
            e('button', { className: 'close-btn', onClick: onClose }, '×')
          ),
          e('div', { className: 'input-group' },
            e('label', { className: 'input-label' }, 'Prénom'),
            e('input', { className: 'input-field', placeholder: 'Jean', value: formData.prenom, onChange: (e) => handleChange('prenom', e.target.value) })
          ),
          e('div', { className: 'input-group' },
            e('label', { className: 'input-label' }, 'Nom'),
            e('input', { className: 'input-field', placeholder: 'Mvondo', value: formData.nom, onChange: (e) => handleChange('nom', e.target.value) })
          ),
          e('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12, marginBottom: 16 } },
            e('div', { className: 'input-group', style: { marginBottom: 0 } },
              e('label', { className: 'input-label' }, 'Naissance'),

    // ========================= MAIN APP =========================
    function App() {
      const [currentScreen, setCurrentScreen] = useState('accueil');
      const [isOnline, setIsOnline] = useState(navigator.onLine);

      useEffect(() => {
        const handleOnline = () => setIsOnline(true);
        const handleOffline = () => setIsOnline(false);
        window.addEventListener('online', handleOnline);
        window.addEventListener('offline', handleOffline);
        return () => {
          window.removeEventListener('online', handleOnline);
          window.removeEventListener('offline', handleOffline);
        };
      }, []);

      const screens = [
        { id: 'accueil', label: 'Accueil', icon: 'Home', component: HomeScreen },
        { id: 'dashboard', label: 'Tableau de bord', icon: 'Users', component: DashboardScreen },
        { id: 'arbre', label: 'Arbre', icon: 'GitBranch', component: ArbreScreen },
        { id: 'memoire', label: 'Mémoire', icon: 'BookOpen', component: MemoireScreen },
        { id: 'carte', label: 'Carte', icon: 'MapPin', component: CarteScreen },
        { id: 'collab', label: 'Équipe', icon: 'Users', component: CollaborateursScreen },
      ];

      const CurrentComponent = screens.find(s => s.id === currentScreen)?.component || HomeScreen;

      return e('div', null,
        e('header', { className: 'header' },
          e('a', { className: 'header-logo', style: { cursor: 'pointer' }, onClick: () => setCurrentScreen('accueil') }, '🏛️ GRIOT'),
          e('div', { className: 'header-right' },
            e('span', { className: `status-badge ${isOnline ? 'online' : 'offline'}` },
              isOnline ? '✓ En ligne' : '⚠️ Hors ligne'
            )
          )
        ),
        e('div', { className: 'main-container' },
          e('nav', { className: 'nav-rail' },
            screens.map((screen, idx) => 
              e('button', {
                key: screen.id,
                className: `nav-item ${currentScreen === screen.id ? 'active' : ''}`,
                onClick: () => setCurrentScreen(screen.id),
                title: screen.label,
                style: { animation: `fadeInUp 0.3s ease ${idx * 0.05}s both` }
              },
                Icon[screen.icon] && e(Icon[screen.icon]),
                e('span', null, screen.label)
              )
            )
          ),
          e('main', { className: 'content' },
            e(CurrentComponent)
          )
        )
      );
    }

    // Mount App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(e(App));
  </script>
