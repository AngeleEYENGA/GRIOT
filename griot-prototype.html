// Note : ces mesures ne bloquent pas un utilisateur déterminé, elles

(function () {
  console.log("%c© GAM Labs — contact.gamlabs@proton.me", "font-size:12px;color:#C9932E;");
  console.log("%cCe prototype et son contenu sont protégés. Toute reproduction non autorisée est interdite.", "font-size:11px;color:#5B4636;");

  // Bloque le clic droit / menu contextuel
  document.addEventListener("contextmenu", function (e) {
    e.preventDefault();
  });

  // Bloque la sélection de texte (sauf dans les champs de formulaire)
  document.addEventListener("selectstart", function (e) {
    const tag = e.target.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    e.preventDefault();
  });

  // Bloque le glisser-déposer d'images
  document.addEventListener("dragstart", function (e) {
    e.preventDefault();
  });

  // Bloque les raccourcis DevTools / affichage code source
  document.addEventListener("keydown", function (e) {
    const key = e.key;
    const blocked =
      key === "F12" ||
      (e.ctrlKey && e.shiftKey && ["I", "J", "C", "i", "j", "c"].includes(key)) ||
      (e.ctrlKey && ["u", "U", "s", "S"].includes(key)) ||
      (e.metaKey && e.altKey && ["I", "J", "C", "i", "j", "c"].includes(key));
    if (blocked) {
      e.preventDefault();
      e.stopPropagation();
      return false;
    }
  });

  // Détection basique d'ouverture des DevTools (via écart de taille de fenêtre)
  let warned = false;
  function checkDevTools() {
    const threshold = 160;
    const widthDiff = window.outerWidth - window.innerWidth;
    const heightDiff = window.outerHeight - window.innerHeight;
    if ((widthDiff > threshold || heightDiff > threshold) && !warned) {
      warned = true;
      console.log(
        "%c⚠ Outils de développement détectés — GAM Labs, contact.gamlabs@proton.me",
        "font-size:13px;color:#B5502A;font-weight:bold;"
      );
    }
    if (widthDiff <= threshold && heightDiff <= threshold) {
      warned = false;
    }
  }
  setInterval(checkDevTools, 1000);
})();
</script>
